<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Atendimentos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { text-align: center; }
        form { display: inline-block; margin-top: 40px; }
        input { display: block; margin: 10px auto; padding: 6px; }
        .erro { color: red; }
        a { text-decoration: none; color: blue; }
    </style>
</head>
<body>
    <h1>Login</h1>
    {% if erro %}
    <p class="erro">{{ erro }}</p>
    {% endif %}
    <form method="post">
        <input type="text" name="usuario" placeholder="Usuário" required>
        <input type="password" name="senha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>

    <p><a href="{{ url_for('registrar') }}">Cadastrar novo usuário</a></p>
	<img src="/media/logo.png" class="logo"></img>
</body>
</html>
